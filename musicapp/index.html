<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <title>Cours de Musique</title>
  <link rel="shortcut icon" type="image/x-icon" href="//favicon.png">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="initial-scale=1.0, width=device-width, height=device-height" />
  <link rel="stylesheet" href="css/wheel.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href='https://fonts.googleapis.com/css?family=Quicksand' rel='stylesheet'>
</head>

<body>
  <div id="app">

    <header>
      <div id="mode-buttons">
        <button id="scaleMode">Gammes</button>
        <button id="toolMode">Outils</button>
        <button id="chordMode">Accords</button>
      </div>
      <div id="typeMenu"></div>
      <div id="notation-buttons">
        <button id="notation">♯</button>
        <button id="language">FR</button>
      </div>
    </header>

    <div id="currentSelection"></div>

    <main>
      <div id="wheel" class="canvas">
        <div class="wheel-clip">
          <div class="circle"></div>
          <div id="notes" class="in"></div>
        </div>
        <div id="center"></div>
        <div id="ticks" class="box tickbox"></div>
        <div id="labels" class="box out"></div>
      </div>
    </main>

    <footer>
      <div>Fait par <a href="https://www.martingalilee.fr" target="_blank">Martin</a> &ndash; 2026 &ndash; ☕ <a href="https://share.weropay.eu/p/1/c/5jbpk6rxmo" target="_blank">Soutenir</a></div>
    </footer>

  </div>
  <script src="js/jquery.min.js"></script>
  <script src="js/jquery-ui.min.js"></script>
  <script src="js/jquery.ui.touch-punch.min.js"></script>
  <script type="text/javascript" src="js/data.js"></script>
  <script type="text/javascript" src="js/wheel.js"></script>
  <script type="text/javascript" src="js/app.js"></script>
</body>

</html>
